<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hawa Mail ✈️ — Hawa AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:22px 14px}.head{display:flex;align-items:center;justify-content:space-between}
.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:18px;margin:14px 0}
h1{margin:0}.sub{color:#999}.chat{height:55vh;overflow:auto;background:#0d0d0d;border:1px solid #252525;border-radius:14px;padding:12px}
.msg{max-width:86%;padding:11px 13px;margin:8px 0;border-radius:14px;white-space:pre-wrap;line-height:1.6}
.user{background:#fff;color:#000;margin-right:auto}.ai{background:#1d1d1d;color:#fff;margin-left:auto}
.row{display:flex;gap:8px;margin-top:10px}textarea{flex:1;resize:none;height:54px;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;font-size:15px}
button{border:0;border-radius:12px;padding:0 17px;background:#fff;color:#000;font-weight:bold;cursor:pointer}
.clear{padding:10px 13px}.status{font-size:12px;color:#777;margin-top:8px}
</style>
</head>
<body><main>
<div class="head"><div><h1>✈️ Hawa Mail</h1><div class="sub">✨ Hawa AI</div></div><button class="clear" onclick="clearChat()">مسح المحادثة</button></div>
<div class="card"><div id="chat" class="chat"><div class="msg ai">أهلًا 👋 أنا Hawa AI. اسألني أي حاجة.</div></div>
<div class="row"><textarea id="input" placeholder="اكتب رسالتك هنا..." onkeydown="key(event)"></textarea><button id="send" onclick="send()">إرسال</button></div>
<div id="status" class="status">متصل بـ Hawa AI</div></div>
</main>
<script>
const WORKER="https://hawa-ai.nsrhkym17.workers.dev";
let history=[];
function add(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;document.getElementById("chat").appendChild(d);d.scrollIntoView({behavior:"smooth"});}
function key(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
function clearChat(){history=[];document.getElementById("chat").innerHTML='<div class="msg ai">أهلًا 👋 أنا Hawa AI. اسألني أي حاجة.</div>';}
async function send(){
 const input=document.getElementById("input"),text=input.value.trim();if(!text)return;
 input.value="";add(text,"user");history.push({role:"user",content:text});
 const status=document.getElementById("status"),btn=document.getElementById("send");btn.disabled=true;status.textContent="⏳ Hawa AI يفكر...";
 try{
  const r=await fetch(WORKER+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history.slice(-12)})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"حدث خطأ");
  const answer=data.answer||"لم يصل رد.";add(answer,"ai");history.push({role:"assistant",content:answer});status.textContent="متصل بـ Hawa AI";
 }catch(e){add("❌ "+e.message,"ai");status.textContent="حدث خطأ في الاتصال";}
 btn.disabled=false;input.focus();
}
</script></body></html>
