<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hawa Mail</title><style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:20px}.box{max-width:700px;margin:auto;background:#111;border:1px solid #292929;border-radius:18px;padding:18px}input{width:70%;padding:14px;background:#080808;color:white;border:1px solid #333;border-radius:10px}button{padding:14px 18px;border:0;border-radius:10px;font-weight:bold}.chat{height:350px;overflow:auto;background:#080808;padding:12px;border-radius:12px;margin:12px 0}.m{padding:10px;margin:7px;border-radius:10px;white-space:pre-wrap}.u{background:white;color:black}.a{background:#191919}</style></head><body>
<div class="box"><h1>✈️ Hawa Mail</h1><h2>✨ Hawa AI</h2><div id="chat" class="chat"><div class="m a">أهلاً 👋 أنا Hawa AI. اسألني أي حاجة.</div></div><input id="i" placeholder="اكتب رسالتك..."><button onclick="send()">إرسال</button><p id="s">متصل</p></div>
<script>
const API="https://hawa-ai.nsrhkym17.workers.dev/chat";let msgs=[];
function add(t,c){let x=document.createElement("div");x.className="m "+c;x.textContent=t;chat.appendChild(x);chat.scrollTop=chat.scrollHeight}
async function send(){let t=i.value.trim();if(!t)return;i.value="";add(t,"u");msgs.push({role:"user",content:t});s.textContent="جاري الرد...";
try{let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs})});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.details||d.error||"خطأ");msgs.push({role:"assistant",content:d.reply});add(d.reply,"a");s.textContent="متصل"}catch(e){add("حصل خطأ: "+e.message,"a");s.textContent="خطأ في الاتصال"}}
i.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script></body></html>
